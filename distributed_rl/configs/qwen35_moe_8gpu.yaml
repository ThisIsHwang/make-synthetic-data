# Qwen3.5-35B MoE GRPO — 8-GPU single-node
# GPU 0-5: policy training (DeepSpeed ZeRO-2), GPU 6: MetricX, GPU 7: XComet
#
# Launch:
#   CUDA_VISIBLE_DEVICES=0,1,2,3,4,5 torchrun --nproc_per_node=6 \
#       -m distributed_rl --config configs/qwen35_moe_8gpu.yaml

model:
  policy_name_or_path: Qwen/Qwen3.5-35B-A3B
  trust_remote_code: true
  attn_implementation: flash_attention_2
  gradient_checkpointing: true
  gradient_checkpointing_kwargs:
    use_reentrant: false

data:
  hf_dataset_name: google/wmt24pp
  hf_dataset_config_name: en-ko_KR
  hf_train_split: train
  hf_eval_split: train
  eval_limit: 32

  id_field: segment_id
  src_text_field: source
  ref_text_field: target
  src_lang_field: src_lang
  tgt_lang_field: tgt_lang
  src_lang_code_field: src_lang_code
  tgt_lang_code_field: tgt_lang_code
  is_bad_source_field: is_bad_source
  skip_bad_source: true
  default_src_lang: English
  default_tgt_lang: Korean
  default_src_lang_code: en
  default_tgt_lang_code: ko

prompt:
  template: >-
    You are a professional {source_lang} ({src_lang_code}) to {target_lang} ({tgt_lang_code})
    translator. Your goal is to accurately convey the meaning and nuances of the original
    {source_lang} text while adhering to {target_lang} grammar, vocabulary, and cultural
    sensitivities. Produce only the {target_lang} translation, without any additional
    explanations or commentary. Please translate the following {source_lang} text into
    {target_lang}:\n\n{text}

generation:
  max_new_tokens: 256
  temperature: 0.4
  top_p: 0.95
  top_k: 50
  num_generations: 4
  repetition_penalty: 1.0

reward:
  w_metricx: 1.0
  w_xcomet: 0.0
  metricx:
    enabled: true
    model_name: google/metricx-24-hybrid-xxl-v2p6
    tokenizer_name: google/mt5-xl
    use_reference: false
    batch_size: 2
    gpu_id: 6
    dtype: float16
    max_input_length: 2048
    offset: 5.0
    python_executable: ../../.venv-metrics/bin/python
    subprocess_timeout_sec: 1800.0
  xcomet:
    enabled: true
    model_name: Unbabel/XCOMET-XL
    batch_size: 1
    gpu_id: 7
    use_reference: false
    python_executable: ../../.venv-xcomet/bin/python
    subprocess_timeout_sec: 1800.0

training:
  loss_type: grpo              # grpo | dapo | dr_grpo | sapo | gspo
  beta: 0.01
  epsilon: 0.2
  scale_rewards: group
  lr: 1.0e-6
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 4    # Effective batch = 6 ranks × 2 × 4 = 48
  max_grad_norm: 1.0
  max_steps: 720
  warmup_ratio: 0.03
  save_steps: 200
  eval_steps: 50
  logging_steps: 1
  # MoE-specific
  output_router_logits: true
  router_aux_loss_coef: 0.001

distributed:
  deepspeed: configs/deepspeed_zero2.json
  nccl_timeout_minutes: 120

misc:
  seed: 42
  dtype: bfloat16
  output_dir: ./outputs/qwen35-grpo-8gpu
  huggingface_cache_dir: /media/sdd3
  huggingface_token_env: HF_TOKEN
