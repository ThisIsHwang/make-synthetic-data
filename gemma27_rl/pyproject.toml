[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gemma27-rl"
version = "0.1.0"
description = "GRPO-style RL post-training pipeline for Gemma translation models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0.1",
  "datasets>=2.21.0",
  "peft>=0.17.0",
  "sentencepiece>=0.2.0",
  "torch>=2.6.0,<2.7.0",
  "transformers>=4.57.0,<5.0.0",
]

[project.optional-dependencies]
train = [
  "accelerate>=0.34.0",
]
monitor = [
  "tensorboard>=2.16.0",
  "wandb>=0.19.0",
]
reward = [
  "setuptools<81",
  "unbabel-comet>=2.2.0",
]
deepspeed = [
  "deepspeed>=0.15.4",
]
test = [
  "pytest>=8.0.0",
]
full = [
  "accelerate>=0.34.0",
  "deepspeed>=0.15.4",
  "pytest>=8.0.0",
  "setuptools<81",
  "tensorboard>=2.16.0",
  "unbabel-comet>=2.2.0",
  "wandb>=0.19.0",
]

[project.scripts]
gemma27_rl = "gemma27_rl.cli:main"

[tool.setuptools]
packages = ["gemma27_rl"]
